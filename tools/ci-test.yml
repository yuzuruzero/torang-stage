# CATATAN: file ini SENGAJA ditaruh di tools/, BUKAN .github/workflows/.
# Push file di .github/workflows/* butuh kredensial ber-scope `workflow` —
# kredensial tersimpan Hadi tidak punya itu (dan tidak wajib).
# Cara mengaktifkan CI (sekali, lewat browser, tanpa token):
#   github.com/yuzuruzero/torang-stage → tab Actions → "set up a workflow
#   yourself" → tempel isi file ini → Commit changes (via web UI).
name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # vitest tidak butuh binari Electron (e2e-nya murni Node) — hemat waktu CI
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -p packages/shared/tsconfig.json
      - run: npx tsc -p apps/cloud/tsconfig.json
      - run: npx tsc -p apps/theater/tsconfig.json
      - run: npm test
