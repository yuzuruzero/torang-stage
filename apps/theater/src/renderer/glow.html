<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin:0; width:100vw; height:100vh; background:transparent; overflow:hidden; }
  #glow { position:fixed; inset:0; pointer-events:none; opacity:0; border-radius:6px; }

  #glow.pulse { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse {
    0%,100% { opacity:.25; box-shadow: inset 0 0 60px 12px #3350cc; }
    50%     { opacity:.95; box-shadow: inset 0 0 120px 34px #5a7bff; }
  }

  #glow.breathe { animation: breathe 3.4s ease-in-out infinite; }
  @keyframes breathe {
    0%,100% { opacity:.15; box-shadow: inset 0 0 50px 10px #2a9d6b; }
    50%     { opacity:.7;  box-shadow: inset 0 0 110px 30px #43d17c; }
  }

  #glow.wave { animation: wave 1.6s linear infinite; }
  @keyframes wave {
    0%   { opacity:.9; box-shadow: inset  40px 0 90px 4px #f2a33c; }
    25%  { opacity:.7; box-shadow: inset 0  40px 90px 4px #f2a33c; }
    50%  { opacity:.9; box-shadow: inset -40px 0 90px 4px #f2a33c; }
    75%  { opacity:.7; box-shadow: inset 0 -40px 90px 4px #f2a33c; }
    100% { opacity:.9; box-shadow: inset  40px 0 90px 4px #f2a33c; }
  }
</style>
</head>
<body>
  <div id="glow"></div>
  <script src="./glow.js"></script>
</body>
</html>
